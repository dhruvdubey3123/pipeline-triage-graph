[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-triage-graph"
version = "0.1.0"
description = "Multi-agent incident triage for data pipelines: dependency-graph tracer, precedent search, human approval gate, eval suite."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Dhruv Dubey"}]
dependencies = [
  "langgraph>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
llm = ["anthropic>=0.40"]
local = ["httpx>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "mcp>=2.0"]

[tool.setuptools]
packages = ["triage", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
