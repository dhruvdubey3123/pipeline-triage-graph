name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Eval gate (clean synthetic set)
        run: python -m evals.run_eval --gate
      - name: Eval gate (noisy synthetic set)
        run: python -m evals.run_eval --data evals/data/incidents_noisy.jsonl --out evals/results_noisy.json --thresholds evals/thresholds_noisy.yaml --gate
      - name: Warehouse eval (real SQL, real breaks; fails if the committed results would change)
        run: python -m evals.warehouse_eval --check
      - uses: actions/upload-artifact@v4
        with: {name: eval-results, path: "evals/results*.json"}
  docker:
    needs: test-and-eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pipeline-triage-graph .
